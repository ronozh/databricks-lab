# Auth is OAuth M2M via a service principal -- no secret in this file, and no
# browser flow (which hangs in CI and in an agent session alike).
# Secrets come from ../../.env.secret, which is gitignored.
databricks_lab:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBX_HOST') }}"
      http_path: "{{ env_var('DBX_HTTP_PATH') }}"
      catalog: "{{ env_var('DBX_CATALOG', 'hr') }}"
      schema: bronze
      auth_type: oauth
      client_id: "{{ env_var('DBX_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBX_CLIENT_SECRET') }}"
      threads: 4
